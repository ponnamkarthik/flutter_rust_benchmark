name: flutter_rust_benchmark
description: A Flutter and Rust frame scheduling benchmark.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  image_picker: ^1.2.3
  rust_lib_flutter_rust_benchmark:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  ffigen: ^8.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
